<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="theme-toggle" id="themeToggle" title="Toggle dark/light mode" role="button" tabindex="0" aria-label="Toggle dark/light mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </header>

    <main>
      <section class="search-section">
        <form id="searchForm" class="search-form">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off" autofocus>
        </form>
      </section>

      <section class="clock-section">
        <div class="local-clock">
          <div class="time" id="localTime"></div>
          <div class="date" id="localDate"></div>
        </div>
      </section>

      <section class="widgets">
        <div class="widget weather-widget" id="weatherWidget">
          <h2>Weather</h2>
          <div class="weather-content" id="weatherContent">
            <div class="weather-loading">Loading weather...</div>
          </div>
          <div class="weather-location-form" id="weatherLocationForm" style="display:none;">
            <input type="text" id="weatherLocationInput" placeholder="Enter city name...">
            <button type="button" id="weatherLocationSubmit">Set</button>
          </div>
          <button class="weather-location-btn" id="weatherLocationBtn" title="Change location" aria-label="Change weather location">📍</button>
        </div>

        <div class="widget worldclock-widget" id="worldClockWidget">
          <h2>World Clocks</h2>
          <div class="worldclock-list" id="worldClockList"></div>
          <div class="worldclock-add" id="worldClockAdd">
            <select id="timezoneSelect" aria-label="Select time zone"></select>
            <button type="button" id="addTimezoneBtn">+ Add</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="analytics.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
